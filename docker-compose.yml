version: '3.8'

services:
  orders-api:
    build: .
    restart: unless-stopped
    ports:
      - "${ORDERS_API_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - DB_USER=labuser
      - DB_PASSWORD=labpassword
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=labdb
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=labuser
      - POSTGRES_PASSWORD=labpassword
      - POSTGRES_DB=labdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d labdb"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
